<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Куриная грудка — 3 pan sauce × 2 техники × 2 порции</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <style>
    :root{
      --bg:#0f0f0d;
      --panel:#191813;
      --panel-2:#252218;
      --text:#fffaf0;
      --muted:#cfc5b1;
      --accent:#d9a85f;
      --accent-2:#efc982;
      --accent-3:#ffe2aa;
      --accent-dark:#7c5428;
      --ok:#7bd39f;
      --cream:#c9a96b;
      --chicken:#dca76b;
      --herb:#97aa73;
      --border:rgba(217,168,95,.24);
      --shadow:0 18px 60px rgba(0,0,0,.42);
      --radius:28px;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}

    body{
      margin:0;
      min-height:100vh;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:
        radial-gradient(circle at 9% -8%, rgba(217,168,95,.22), transparent 34%),
        radial-gradient(circle at 94% 3%, rgba(220,167,107,.14), transparent 31%),
        radial-gradient(circle at 88% 72%, rgba(201,169,107,.10), transparent 34%),
        linear-gradient(135deg,#0b0b09,var(--bg));
      color:var(--text);
    }

    button,input{font:inherit}
    button{-webkit-tap-highlight-color:transparent}

    .app{
      width:min(1180px,100%);
      margin:0 auto;
      padding:28px 18px 46px;
    }

    .hero{
      display:grid;
      grid-template-columns:1.25fr .75fr;
      gap:18px;
      align-items:stretch;
      margin-bottom:18px;
    }

    .card{
      background:linear-gradient(180deg,rgba(255,255,255,.052),rgba(255,255,255,.018)),var(--panel);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .hero-main{padding:28px;position:relative}

    .badge{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border:1px solid rgba(217,168,95,.40);
      border-radius:999px;
      color:var(--accent-3);
      background:rgba(217,168,95,.095);
      font-weight:800;
      font-size:14px;
    }

    h1{
      margin:16px 0 10px;
      font-size:clamp(32px,5vw,60px);
      line-height:.96;
      letter-spacing:-.058em;
    }

    .subtitle{
      font-size:18px;
      color:var(--muted);
      max-width:760px;
      line-height:1.55;
      margin:0;
    }

    .meta-grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:10px;
      margin-top:22px;
    }

    .meta{
      padding:14px 12px;
      border-radius:18px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.065);
      min-width:0;
    }

    .meta b{
      display:block;
      font-size:18px;
      color:var(--accent-3);
      white-space:nowrap;
    }

    .meta span{
      display:block;
      font-size:12px;
      color:var(--muted);
      margin-top:3px;
    }

    .hero-side{
      padding:22px;
      display:flex;
      flex-direction:column;
      gap:16px;
      justify-content:center;
    }

    .plate{
      min-height:190px;
      border-radius:24px;
      border:1px solid rgba(255,255,255,.07);
      background:
        radial-gradient(circle at 50% 46%, rgba(220,167,107,.22), transparent 51%),
        radial-gradient(circle at 25% 24%, rgba(217,168,95,.14), transparent 34%),
        linear-gradient(135deg,rgba(201,169,107,.13),rgba(255,255,255,.03));
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      overflow:hidden;
    }

    .plate .big{
      font-size:88px;
      filter:drop-shadow(0 12px 20px rgba(0,0,0,.38));
    }

    .plate .float{
      position:absolute;
      font-size:28px;
      opacity:.34;
    }

    .f1{left:20px;top:18px}
    .f2{right:26px;top:28px}
    .f3{left:42px;bottom:22px}
    .f4{right:48px;bottom:20px}
    .f5{right:94px;top:90px;font-size:22px!important}

    .progress-wrap{
      padding:16px;
      border-radius:20px;
      background:rgba(0,0,0,.18);
      border:1px solid rgba(255,255,255,.065);
    }

    .progress-top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:10px;
      color:var(--muted);
      font-size:14px;
      gap:10px;
    }

    .progress-top b{color:var(--accent-3)}

    .bar{
      height:12px;
      border-radius:999px;
      background:rgba(255,255,255,.08);
      overflow:hidden;
    }

    .fill{
      height:100%;
      background:linear-gradient(90deg,var(--accent-dark),var(--accent),var(--cream));
      border-radius:999px;
      transition:width .25s ease;
    }

    .actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .btn{
      border:0;
      cursor:pointer;
      border-radius:16px;
      padding:11px 14px;
      color:var(--text);
      background:rgba(255,255,255,.07);
      border:1px solid rgba(255,255,255,.09);
      transition:.15s ease;
      touch-action:manipulation;
    }

    .btn:hover{
      transform:translateY(-1px);
      background:rgba(255,255,255,.105);
    }

    .btn.primary{
      background:linear-gradient(135deg,var(--accent-dark),var(--accent));
      border-color:rgba(255,255,255,.12);
      font-weight:900;
    }

    .layout{
      display:grid;
      grid-template-columns:.86fr 1.14fr;
      gap:18px;
    }

    .section{padding:22px}

    .section h2{
      margin:0 0 14px;
      font-size:24px;
      letter-spacing:-.025em;
    }

    .section h3{
      margin:18px 0 10px;
      font-size:16px;
      color:var(--accent-3);
      text-transform:uppercase;
      letter-spacing:.08em;
    }

    .ingredients{
      display:grid;
      gap:9px;
    }

    .ing{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:11px 12px;
      border-radius:16px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.058);
    }

    .ing .name{
      color:var(--text);
      line-height:1.35;
    }

    .ing .amount{
      color:var(--accent-3);
      font-weight:900;
      text-align:right;
      white-space:nowrap;
    }

    .note{
      color:var(--muted);
      line-height:1.5;
      background:rgba(217,168,95,.085);
      border:1px solid rgba(217,168,95,.17);
      padding:13px 14px;
      border-radius:18px;
      margin-top:14px;
    }

    .tabs{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-bottom:16px;
      position:sticky;
      top:0;
      z-index:2;
      padding:2px 0 8px;
      backdrop-filter:blur(10px);
    }

    .tab{
      padding:10px 12px;
      border-radius:999px;
      background:rgba(255,255,255,.055);
      border:1px solid rgba(255,255,255,.080);
      color:var(--muted);
      cursor:pointer;
      min-height:40px;
    }

    .tab.active{
      color:#2c1b0d;
      background:linear-gradient(135deg,var(--accent-3),var(--accent));
      font-weight:950;
    }

    .todo-list{
      display:grid;
      gap:12px;
    }

    .todo{
      display:grid;
      grid-template-columns:auto 1fr auto;
      gap:13px;
      align-items:start;
      padding:16px;
      border-radius:20px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.065);
      transition:.18s ease;
      cursor:pointer;
    }

    .todo.done{
      opacity:.64;
      background:rgba(123,211,159,.045);
      border-color:rgba(123,211,159,.16);
    }

    .check{
      appearance:none;
      width:28px;
      height:28px;
      border-radius:10px;
      margin:0;
      cursor:pointer;
      border:2px solid rgba(217,168,95,.67);
      background:rgba(0,0,0,.15);
      position:relative;
      flex:none;
    }

    .check:checked{
      background:linear-gradient(135deg,var(--accent),var(--accent-3));
      border-color:transparent;
    }

    .check:checked:after{
      content:"✓";
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#2b1a0b;
      font-weight:1000;
    }

    .todo-title{
      font-weight:950;
      font-size:17px;
      margin:0 0 5px;
      line-height:1.25;
    }

    .todo.done .todo-title{text-decoration:line-through}

    .todo-desc{
      color:var(--muted);
      line-height:1.48;
      margin:0;
    }

    .time{
      color:var(--accent-3);
      font-size:13px;
      font-weight:950;
      padding:6px 9px;
      border-radius:999px;
      background:rgba(217,168,95,.095);
      white-space:nowrap;
    }

    .tips{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:12px;
      margin-top:18px;
    }

    .tip{
      padding:15px;
      border-radius:18px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.058);
    }

    .tip b{
      display:block;
      color:var(--accent-3);
      margin-bottom:6px;
    }

    .tip span{
      color:var(--muted);
      line-height:1.45;
      font-size:14px;
    }

    .macro-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    .macro{
      padding:14px;
      border-radius:18px;
      background:rgba(0,0,0,.16);
      border:1px solid rgba(255,255,255,.065);
    }

    .macro b{
      display:block;
      color:var(--accent-3);
      font-size:20px;
      line-height:1.1;
    }

    .macro span{
      color:var(--muted);
      font-size:13px;
    }

    .variant{
      margin-top:14px;
      border-radius:20px;
      background:linear-gradient(135deg,rgba(220,167,107,.09),rgba(217,168,95,.07));
      border:1px solid rgba(217,168,95,.18);
      padding:14px;
      color:var(--muted);
      line-height:1.5;
    }

    .variant b{color:var(--accent-3)}

    footer{
      margin-top:18px;
      text-align:center;
      color:rgba(255,255,255,.42);
      font-size:13px;
    }

    @media(max-width:900px){
      .hero,.layout{grid-template-columns:1fr}
      .meta-grid{grid-template-columns:repeat(2,1fr)}
      .tips{grid-template-columns:1fr}
      .macro-grid{grid-template-columns:1fr 1fr}
    }

    @media(max-width:560px){
      .app{padding:14px 10px 30px}
      .hero{gap:12px;margin-bottom:12px}
      .layout{gap:12px}
      .hero-main,.hero-side,.section{padding:16px}
      .card{border-radius:22px}
      h1{font-size:clamp(34px,12vw,48px);letter-spacing:-.062em}
      .subtitle{font-size:16px;line-height:1.5}
      .meta-grid{grid-template-columns:1fr 1fr;gap:8px}
      .meta{padding:12px 10px;border-radius:16px}
      .meta b{font-size:16px}
      .plate{min-height:150px;border-radius:20px}
      .plate .big{font-size:72px}
      .todo{grid-template-columns:auto 1fr;padding:14px;gap:11px}
      .time{grid-column:2;justify-self:start;margin-top:2px}
      .todo-title{font-size:16px}
      .todo-desc{font-size:14px}
      .tabs{overflow-x:auto;flex-wrap:nowrap;margin-left:-2px;margin-right:-2px;padding-bottom:10px;position:relative}
      .tab{white-space:nowrap;flex:0 0 auto}
      .ing{align-items:flex-start;flex-direction:column;gap:4px;padding:12px}
      .ing .amount{text-align:left;white-space:normal}
      .macro-grid{grid-template-columns:1fr}
      .actions .btn{flex:1 1 auto}
    }
  
    .sauce-picker{
      display:inline-flex;
      gap:7px;
      padding:6px;
      margin-top:20px;
      border-radius:18px;
      background:rgba(0,0,0,.20);
      border:1px solid rgba(255,255,255,.08);
      max-width:100%;
    }

    .sauce-choice{
      border:0;
      cursor:pointer;
      min-height:42px;
      padding:10px 14px;
      border-radius:13px;
      color:var(--muted);
      background:transparent;
      font-weight:850;
      transition:.16s ease;
      white-space:nowrap;
    }

    .sauce-choice.active{
      color:#2c1b0d;
      background:linear-gradient(135deg,var(--accent-3),var(--accent));
      box-shadow:0 7px 20px rgba(0,0,0,.18);
    }

    .sauce-kicker{
      display:flex;
      align-items:center;
      gap:8px;
      color:var(--accent-3);
      font-size:13px;
      font-weight:900;
      letter-spacing:.04em;
      margin:0 0 9px;
    }

    @media(max-width:560px){
      .sauce-picker{display:grid;grid-template-columns:1fr 1fr;width:100%}
      .sauce-choice{padding:10px 9px;font-size:13px;white-space:normal;line-height:1.2}
    }

  
    .picker-label{
      margin-top:16px;
      margin-bottom:-12px;
      color:var(--muted);
      font-size:12px;
      font-weight:850;
      text-transform:uppercase;
      letter-spacing:.08em;
    }

    .lean-note{
      margin-top:12px;
      padding:12px 14px;
      border-radius:16px;
      background:rgba(123,211,159,.055);
      border:1px solid rgba(123,211,159,.16);
      color:var(--muted);
      line-height:1.48;
      font-size:14px;
    }

    .lean-note b{color:var(--ok)}

  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    const {useState,useEffect} = React;
    const h = React.createElement;

    const portionInfo = {
      single:{
        short:"1 грудка",

        firstSide:"3–4 мин",

          butter:"5 г",

        },
        pepper:{

          stock:"80 мл",

      double:{

        },
        pepper:{
          pepper:"5 г · ~1¾ ч. л. крупно дроблёного",
          dijon:"14 г · ~2½ ч. л.",
          brandy:"40 мл",

          stock:"130 мл",
          cream:"130 мл",

          creamTime:"3–4 мин",

        }
      }
    };

    const sauceBase = {
      dijon:{
        short:"🟡 Dijon Cream",
        full:"Dijon Cream Pan Sauce",
        emoji:"🟡",

          },
          {
            group:"Финиш", icon:"🔥", title:"Сними сковороду с сильного огня", time:"10–15 сек",
            desc:"Полностью выключи конфорку или переставь сковороду на холодную поверхность. Основа должна оставаться горячей, но не бурно кипеть."
          },
          {
            group:"Финиш", icon:"🧈", title:`Эмульгируй ${p.butter} холодного масла`, time:portion === "double" ? "45–75 сек" : "30–60 сек",
            desc:`Добавляй ${p.butter} холодного сливочного масла небольшими кубиками в 2–4 захода, постоянно покачивая сковороду или энергично перемешивая. Соус должен стать глянцевым и чуть более вязким, но не густым как сливочный соус.`
          },
          {
            group:"Финиш", icon:"🍋", title:"Добавь лимон и чёрный перец", time:"20 сек",
            desc:`Вмешай ${p.lemon} лимонного сока постепенно, пробуя. Добавь свежемолотый чёрный перец. Соль — только после финальной пробы.`
          },
          {
            group:"Финиш", icon:"🌿", title:"При желании добавь петрушку", time:"10 сек",
            desc:`Вмешай ${portion === "double" ? "1–2 ч. л." : "около 1 ч. л."} очень мелко нарезанной петрушки. После добавления масла и зелени соус уже не кипяти.`
          }
        ],
        note:p.note,
        variants:[
          ["Почему соус не умножен строго ×2? ","Для двух грудок примерно 1.6–1.7× жидкости и масла достаточно. Полное удвоение даёт слишком большой объём и заставляет долго редуцировать соус."],
          ["Как понять густоту? ","White Wine & Butter остаётся текучим. Он должен тонко покрывать обратную сторону ложки и выглядеть глянцевым, а не становиться густым как gravy."],
          ["Почему масло холодное? ","Холодное масло, вмешанное вне сильного кипения, помогает сформировать стабильную эмульсию без муки и сливок."],
          ["Если основа водянистая: ","Увари её ДО масла. После butter montée долго кипятить уже нежелательно — эмульсия может разрушиться."]
        ]
      };
    }

    function buildSteps(mode,cookMode,portion){
      const cfg = sauceConfig(mode,portion);
      return [
        ...sharedStart(portion).slice(0,2),
        cfg.prep,
        ...sharedStart(portion).slice(2),
        ...cookSteps(portion,cookMode),
        ...tempAndRestSteps(portion),
        ...cfg.steps,
        ...[
          {
            group:"Финиш", icon:"💧", title:"Верни соки от курицы в соус", time:"10 сек",
            desc:"Влей в готовый соус соки, которые собрались на тарелке под отдыхающей курицей. Перемешай уже без активного нагрева."
          },
          {
            group:"Подача", icon:"🔪", title:"Нарежь грудку поперёк волокон", time:"30–60 сек",
            desc:"После отдыха нарежь грудку поперёк волокон ломтиками примерно 8–12 мм. Если готовил две грудки, нарезай каждую отдельно после её собственного отдыха."
          },
          {
            group:"Подача", icon:"🍽️", title:"Добавь выбранный pan sauce", time:"сразу",
            desc:"Выложи немного соуса на тарелку, сверху положи курицу и добавь ещё несколько ложек. Для двух грудок раздели соус между порциями по вкусу."
          }
        ]
      ];
    }

    function App(){
      const [mode,setMode] = useState(() => {
        try{return localStorage.getItem("chickenPanSauceMode") || "dijon";}catch{return "dijon";}
      });

      const [cookMode,setCookMode] = useState(() => {
        try{return localStorage.getItem("chickenCookMode") || "basting";}catch{return "basting";}
      });

      const [portion,setPortion] = useState(() => {
        try{return localStorage.getItem("chickenPortionMode") || "single";}catch{return "single";}
      });

      const [allDone,setAllDone] = useState(() => {
        try{return JSON.parse(localStorage.getItem("chickenSauceTechniquePortionDone") || "{}");}
        catch{return {};}
      });

      const [tab,setTab] = useState("Все");

      const cfg = sauceConfig(mode,portion);
      const cook = cookingModes[cookMode];
      const p = portionInfo[portion];
      const steps = buildSteps(mode,cookMode,portion);
      const progressKey = mode+"_"+cookMode+"_"+portion;
      const done = allDone[progressKey] || {};

      useEffect(() => {
        try{localStorage.setItem("chickenPanSauceMode",mode);}catch{}
        setTab("Все");
      },[mode]);

      useEffect(() => {
        try{localStorage.setItem("chickenCookMode",cookMode);}catch{}
        setTab("Все");
      },[cookMode]);

      useEffect(() => {
        try{localStorage.setItem("chickenPortionMode",portion);}catch{}
        setTab("Все");
      },[portion]);

      useEffect(() => {
        try{localStorage.setItem("chickenSauceTechniquePortionDone",JSON.stringify(allDone));}catch{}
      },[allDone]);

      const groups = ["Все",...Array.from(new Set(steps.map(s=>s.group)))];
      const filtered = tab === "Все" ? steps : steps.filter(s=>s.group === tab);
      const completed = steps.filter((_,i)=>done[i]).length;
      const percent = Math.round((completed / steps.length) * 100);

      const toggle = idx => setAllDone(prev => ({
        ...prev,
        [progressKey]: {...(prev[progressKey]||{}), [idx]:!(prev[progressKey]||{})[idx]}
      }));

      const reset = () => setAllDone(prev => ({...prev,[progressKey]:{}}));

      const markAll = () => {
        const all = {};
        steps.forEach((_,i)=>all[i]=true);
        setAllDone(prev => ({...prev,[progressKey]:all}));
      };

      return h("div",{className:"app"},
        h("section",{className:"hero"},
          h("div",{className:"card hero-main"},
            h("div",{className:"badge"},"🍗 Recipe Todo · 3 соуса · 2 техники · 2 порции"),
            h("h1",null,"Куриная грудка + три pan sauce"),
            h("p",{className:"subtitle"},
              "Выбери отдельно размер порции, соус и способ доведения курицы. Доступны Dijon Cream, Classic White Wine & Butter и сливочно-перечный Black Pepper Cream; для ~600 г все пропорции пересчитаны под две грудки."
            ),

            h("div",{className:"picker-label"},"Порция"),
            h("div",{className:"sauce-picker",role:"tablist","aria-label":"Выбор порции"},
              h("button",{
                className:"sauce-choice "+(portion==="single"?"active":""),
                onClick:()=>setPortion("single"),
                role:"tab",
                "aria-selected":portion==="single"
              },"🍗 1 грудка · 220–280 г"),
              h("button",{
                className:"sauce-choice "+(portion==="double"?"active":""),
                onClick:()=>setPortion("double"),
                role:"tab",
                "aria-selected":portion==="double"
              },"🍗🍗 2 грудки · ~600 г")
            ),

            h("div",{className:"picker-label"},"Соус"),
            h("div",{className:"sauce-picker",role:"tablist","aria-label":"Выбор соуса"},
              h("button",{
                className:"sauce-choice "+(mode==="dijon"?"active":""),
                onClick:()=>setMode("dijon"),
                role:"tab",
                "aria-selected":mode==="dijon"
              },"🟡 Dijon Cream"),
              h("button",{
                className:"sauce-choice "+(mode==="white"?"active":""),
                onClick:()=>setMode("white"),
                role:"tab",
                "aria-selected":mode==="white"
              },"🍷 White Wine & Butter"),
              h("button",{
                className:"sauce-choice "+(mode==="pepper"?"active":""),
                onClick:()=>setMode("pepper"),
                role:"tab",
                "aria-selected":mode==="pepper"
              },"⚫ Black Pepper Cream")
            ),

            h("div",{className:"picker-label"},"Техника курицы"),
            h("div",{className:"sauce-picker",role:"tablist","aria-label":"Выбор техники курицы"},
              h("button",{
                className:"sauce-choice "+(cookMode==="basting"?"active":""),
                onClick:()=>setCookMode("basting"),
                role:"tab",
                "aria-selected":cookMode==="basting"
              },"🧈 С basting"),
              h("button",{
                className:"sauce-choice "+(cookMode==="lean"?"active":""),
                onClick:()=>setCookMode("lean"),
                role:"tab",
                "aria-selected":cookMode==="lean"
              },"🌿 Без basting")
            ),

            h("div",{className:"meta-grid"},
              h("div",{className:"meta"},h("b",null,p.chickenWeight),h("span",null,"куриная грудка")),
              h("div",{className:"meta"},h("b",null,"2–2.5 см"),h("span",null,"желательная толщина")),
              h("div",{className:"meta"},h("b",null,"70–72°C"),h("span",null,"снимать каждую")),
              h("div",{className:"meta"},h("b",null,portion==="double"?"2–3 см":"свободно"),h("span",null,portion==="double"?"зазор между грудками":"место на сковороде"))
            )
          ),

          h("aside",{className:"card hero-side"},
            h("div",{className:"plate"},
              h("span",{className:"float f1"},cfg.emoji),
              h("span",{className:"float f2"},portion==="double"?"🍗":"🧄"),
              h("span",{className:"float f3"},cook.emoji),
              h("span",{className:"float f4"},cfg.secondaryEmoji),
              h("span",{className:"float f5"},"🌡️"),
              h("span",{className:"big"},portion==="double"?"🍗🍗":"🍗")
            ),
            h("div",{className:"progress-wrap"},
              h("div",{className:"progress-top"},
                h("span",null,"Прогресс · "+p.short+" · "+cfg.short),
                h("b",null,completed + "/" + steps.length + " · " + percent + "%")
              ),
              h("div",{className:"bar"},h("div",{className:"fill",style:{width:percent + "%"}}))
            ),
            h("div",{className:"actions"},
              h("button",{className:"btn primary",onClick:markAll},"Готово всё"),
              h("button",{className:"btn",onClick:reset},"Сбросить")
            )
          )
        ),

        h("main",{className:"layout"},
          h("aside",{className:"card section"},
            h("h2",null,"Ингредиенты"),
            h("div",{className:"sauce-kicker"},"🍗 Порция: ",p.full),
            h("div",{className:"sauce-kicker"},cfg.emoji," Соус: ",cfg.full),
            h("div",{className:"sauce-kicker"},cook.emoji," Техника: ",cook.full),
            h("p",{className:"subtitle",style:{fontSize:"15px",marginBottom:"12px"}},cfg.subtitle),

            h("div",{className:"lean-note"},
              h("b",null,portion==="double"?"🍗🍗 Две грудки одновременно. ":"🍗 Одна грудка. "),
              p.panNote
            ),

            h("div",{className:"lean-note"},
              h("b",null,cookMode==="lean"?"🌿 Более лёгкий вариант. ":"🧈 Более ароматный вариант. "),
              cook.calorieNote
            ),

            h("h3",null,cook.heading),
            h("div",{className:"ingredients"},
              chickenIngredients(portion,cookMode).map((item,i)=>h("div",{className:"ing",key:"chicken"+portion+cookMode+i},
                h("span",{className:"name"},item[0]),
                h("span",{className:"amount"},item[1])
              ))
            ),

            h("h3",null,cfg.full),
            h("div",{className:"ingredients"},
              cfg.ingredients.map((item,i)=>h("div",{className:"ing",key:"sauce"+mode+portion+i},
                h("span",{className:"name"},item[0]),
                h("span",{className:"amount"},item[1])
              ))
            ),

            h("h3",null,"Опционально / настройка"),
            h("div",{className:"ingredients"},
              cfg.optional.map((item,i)=>h("div",{className:"ing",key:"opt"+mode+portion+i},
                h("span",{className:"name"},item[0]),
                h("span",{className:"amount"},item[1])
              ))
            ),

            h("p",{className:"note"},cfg.note),

            h("h3",null,"Температура и огонь"),
            h("div",{className:"macro-grid"},
              h("div",{className:"macro"},h("b",null,"6/9"),h("span",null,"первая сторона")),
              h("div",{className:"macro"},h("b",null,"5/9"),h("span",null,"вторая сторона")),
              h("div",{className:"macro"},
                h("b",null,cookMode==="basting"?"4–5/9":"4/9"),
                h("span",null,cookMode==="basting"?"butter basting":"доведение без масла")
              ),
              h("div",{className:"macro"},
                h("b",null,mode==="dijon"?"3–4/9":"off heat"),
                h("span",null,mode==="dijon"?"сливки + Dijon":"монтаж холодным маслом")
              ),
              h("div",{className:"macro"},h("b",null,"70–72°C"),h("span",null,"снимать каждую грудку")),
              h("div",{className:"macro"},h("b",null,"5–7 мин"),h("span",null,"отдых курицы"))
            ),

            cfg.variants.map((v,i)=>h("div",{className:"variant",key:"v"+mode+portion+i},
              h("b",null,v[0]),v[1]
            ))
          ),

          h("section",{className:"card section"},
            h("h2",null,"Пошаговый todo"),
            h("div",{className:"tabs"},
              groups.map(g=>h("button",{
                key:g,
                className:"tab "+(tab===g?"active":""),
                onClick:()=>setTab(g)
              },g))
            ),

            h("div",{className:"todo-list"},
              filtered.map(step=>{
                const originalIdx = steps.indexOf(step);
                return h("label",{
                  className:"todo "+(done[originalIdx]?"done":""),
                  key:progressKey+step.title
                },
                  h("input",{
                    className:"check",
                    type:"checkbox",
                    checked:!!done[originalIdx],
                    onChange:()=>toggle(originalIdx)
                  }),
                  h("div",null,
                    h("p",{className:"todo-title"},step.icon+" "+step.title),
                    h("p",{className:"todo-desc"},step.desc)
                  ),
                  h("span",{className:"time"},step.time)
                );
              })
            ),

            h("div",{className:"tips"},
              h("div",{className:"tip"},
                h("b",null,portion==="double"?"🍗🍗 Не перегружай сковороду":"🔥 Нержавейка"),
                h("span",null,portion==="double"
                  ?"Если грудки касаются друг друга или почти полностью закрывают дно, жарь партиями. Свободное пространство важнее желания приготовить обе сразу."
                  :"Грудка должна быть сухой, сковорода хорошо прогрета, а мясо не нужно отрывать силой до формирования корочки."
                )
              ),
              h("div",{className:"tip"},
                h("b",null,"🌡️ Температура"),
                h("span",null,portion==="double"
                  ?"Измеряй каждую грудку отдельно. Снимай готовую раньше — не жди, пока вторая догонит её."
                  :"Время — ориентир. Проверяй самую толстую центральную часть щупом."
                )
              ),
              h("div",{className:"tip"},
                h("b",null,cfg.emoji+" "+cfg.full),
                h("span",null,mode==="dijon"
                  ?"Сначала редуцируй вино и бульон, потом добавляй сливки и Dijon. Финальное холодное масло — после нужной густоты."
                  : mode==="white"
                    ?"Вино и бульон хорошо увари ДО масла. После butter montée не давай соусу бурно кипеть."
                    :"Перец только слегка поджарь; бренди хорошо увари; после сливок держи мягкий simmer, а не бурное кипение."
                )
              )
            )
          )
        ),

        h("footer",null,
          "Chicken breast · "+p.full+" · "+cook.full+" · "+cfg.full+" · отдельный прогресс для каждой комбинации"
        )
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(h(App));
  </script>
</body>
</html>
