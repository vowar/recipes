<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0f0f0d" />
  <title>Рецепты</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%B3%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="assets/site.css" />
  <!-- React is served locally from assets/vendor (no CDN). Classic scripts run before the module script below. -->
  <script src="assets/vendor/react.production.min.js"></script>
  <script src="assets/vendor/react-dom.production.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    // Dynamic import so that an error in any module is shown on the page instead of leaving it blank.
    import("./assets/app.js").catch(err => {
      const el = document.getElementById("root");
      el.textContent = "";
      const pre = document.createElement("pre");
      pre.className = "fatal";
      pre.textContent = "Не удалось запустить приложение:\n" + ((err && err.stack) || err);
      el.appendChild(pre);
      console.error(err);
    });
  </script>
</body>
</html>
