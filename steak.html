<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Стейк с butter basting — Red Wine или Peppercorn Cream Sauce</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <style>
    :root{
      --bg:#0f0f0d;
      --panel:#191813;
      --panel-2:#252218;
      --text:#fffaf0;
      --muted:#cfc5b1;
      --accent:#d9a85f;
      --accent-2:#efc982;
      --accent-3:#ffe2aa;
      --accent-dark:#7c5428;
      --ok:#7bd39f;
      --wine:#8e4a53;
      --beef:#a84d3e;
      --herb:#97aa73;
      --border:rgba(217,168,95,.24);
      --shadow:0 18px 60px rgba(0,0,0,.42);
      --radius:28px;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}

    body{
      margin:0;
      min-height:100vh;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:
        radial-gradient(circle at 9% -8%, rgba(217,168,95,.22), transparent 34%),
        radial-gradient(circle at 94% 3%, rgba(168,77,62,.15), transparent 31%),
        radial-gradient(circle at 88% 72%, rgba(142,74,83,.11), transparent 34%),
        linear-gradient(135deg,#0b0b09,var(--bg));
      color:var(--text);
    }

    button,input{font:inherit}
    button{-webkit-tap-highlight-color:transparent}

    .app{
      width:min(1180px,100%);
      margin:0 auto;
      padding:28px 18px 46px;
    }

    .hero{
      display:grid;
      grid-template-columns:1.25fr .75fr;
      gap:18px;
      align-items:stretch;
      margin-bottom:18px;
    }

    .card{
      background:linear-gradient(180deg,rgba(255,255,255,.052),rgba(255,255,255,.018)),var(--panel);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .hero-main{padding:28px;position:relative}

    .badge{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border:1px solid rgba(217,168,95,.40);
      border-radius:999px;
      color:var(--accent-3);
      background:rgba(217,168,95,.095);
      font-weight:800;
      font-size:14px;
    }

    h1{
      margin:16px 0 10px;
      font-size:clamp(32px,5vw,60px);
      line-height:.96;
      letter-spacing:-.058em;
    }

    .subtitle{
      font-size:18px;
      color:var(--muted);
      max-width:760px;
      line-height:1.55;
      margin:0;
    }

    .meta-grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:10px;
      margin-top:22px;
    }

    .meta{
      padding:14px 12px;
      border-radius:18px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.065);
      min-width:0;
    }

    .meta b{
      display:block;
      font-size:18px;
      color:var(--accent-3);
      white-space:nowrap;
    }

    .meta span{
      display:block;
      font-size:12px;
      color:var(--muted);
      margin-top:3px;
    }

    .hero-side{
      padding:22px;
      display:flex;
      flex-direction:column;
      gap:16px;
      justify-content:center;
    }

    .plate{
      min-height:190px;
      border-radius:24px;
      border:1px solid rgba(255,255,255,.07);
      background:
        radial-gradient(circle at 50% 46%, rgba(168,77,62,.22), transparent 51%),
        radial-gradient(circle at 25% 24%, rgba(217,168,95,.14), transparent 34%),
        linear-gradient(135deg,rgba(142,74,83,.15),rgba(255,255,255,.03));
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      overflow:hidden;
    }

    .plate .big{
      font-size:88px;
      filter:drop-shadow(0 12px 20px rgba(0,0,0,.38));
    }

    .plate .float{
      position:absolute;
      font-size:28px;
      opacity:.34;
    }

    .f1{left:20px;top:18px}
    .f2{right:26px;top:28px}
    .f3{left:42px;bottom:22px}
    .f4{right:48px;bottom:20px}
    .f5{right:94px;top:90px;font-size:22px!important}

    .progress-wrap{
      padding:16px;
      border-radius:20px;
      background:rgba(0,0,0,.18);
      border:1px solid rgba(255,255,255,.065);
    }

    .progress-top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:10px;
      color:var(--muted);
      font-size:14px;
      gap:10px;
    }

    .progress-top b{color:var(--accent-3)}

    .bar{
      height:12px;
      border-radius:999px;
      background:rgba(255,255,255,.08);
      overflow:hidden;
    }

    .fill{
      height:100%;
      background:linear-gradient(90deg,var(--accent-dark),var(--accent),var(--wine));
      border-radius:999px;
      transition:width .25s ease;
    }

    .actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .btn{
      border:0;
      cursor:pointer;
      border-radius:16px;
      padding:11px 14px;
      color:var(--text);
      background:rgba(255,255,255,.07);
      border:1px solid rgba(255,255,255,.09);
      transition:.15s ease;
      touch-action:manipulation;
    }

    .btn:hover{
      transform:translateY(-1px);
      background:rgba(255,255,255,.105);
    }

    .btn.primary{
      background:linear-gradient(135deg,var(--accent-dark),var(--accent));
      border-color:rgba(255,255,255,.12);
      font-weight:900;
    }

    .layout{
      display:grid;
      grid-template-columns:.86fr 1.14fr;
      gap:18px;
    }

    .section{padding:22px}

    .section h2{
      margin:0 0 14px;
      font-size:24px;
      letter-spacing:-.025em;
    }

    .section h3{
      margin:18px 0 10px;
      font-size:16px;
      color:var(--accent-3);
      text-transform:uppercase;
      letter-spacing:.08em;
    }

    .ingredients{
      display:grid;
      gap:9px;
    }

    .ing{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:11px 12px;
      border-radius:16px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.058);
    }

    .ing .name{
      color:var(--text);
      line-height:1.35;
    }

    .ing .amount{
      color:var(--accent-3);
      font-weight:900;
      text-align:right;
      white-space:nowrap;
    }

    .note{
      color:var(--muted);
      line-height:1.5;
      background:rgba(217,168,95,.085);
      border:1px solid rgba(217,168,95,.17);
      padding:13px 14px;
      border-radius:18px;
      margin-top:14px;
    }

    .tabs{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-bottom:16px;
      position:sticky;
      top:0;
      z-index:2;
      padding:2px 0 8px;
      backdrop-filter:blur(10px);
    }

    .tab{
      padding:10px 12px;
      border-radius:999px;
      background:rgba(255,255,255,.055);
      border:1px solid rgba(255,255,255,.080);
      color:var(--muted);
      cursor:pointer;
      min-height:40px;
    }

    .tab.active{
      color:#2c1b0d;
      background:linear-gradient(135deg,var(--accent-3),var(--accent));
      font-weight:950;
    }

    .todo-list{
      display:grid;
      gap:12px;
    }

    .todo{
      display:grid;
      grid-template-columns:auto 1fr auto;
      gap:13px;
      align-items:start;
      padding:16px;
      border-radius:20px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.065);
      transition:.18s ease;
      cursor:pointer;
    }

    .todo.done{
      opacity:.64;
      background:rgba(123,211,159,.045);
      border-color:rgba(123,211,159,.16);
    }

    .check{
      appearance:none;
      width:28px;
      height:28px;
      border-radius:10px;
      margin:0;
      cursor:pointer;
      border:2px solid rgba(217,168,95,.67);
      background:rgba(0,0,0,.15);
      position:relative;
      flex:none;
    }

    .check:checked{
      background:linear-gradient(135deg,var(--accent),var(--accent-3));
      border-color:transparent;
    }

    .check:checked:after{
      content:"✓";
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#2b1a0b;
      font-weight:1000;
    }

    .todo-title{
      font-weight:950;
      font-size:17px;
      margin:0 0 5px;
      line-height:1.25;
    }

    .todo.done .todo-title{text-decoration:line-through}

    .todo-desc{
      color:var(--muted);
      line-height:1.48;
      margin:0;
    }

    .time{
      color:var(--accent-3);
      font-size:13px;
      font-weight:950;
      padding:6px 9px;
      border-radius:999px;
      background:rgba(217,168,95,.095);
      white-space:nowrap;
    }

    .tips{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:12px;
      margin-top:18px;
    }

    .tip{
      padding:15px;
      border-radius:18px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.058);
    }

    .tip b{
      display:block;
      color:var(--accent-3);
      margin-bottom:6px;
    }

    .tip span{
      color:var(--muted);
      line-height:1.45;
      font-size:14px;
    }

    .macro-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    .macro{
      padding:14px;
      border-radius:18px;
      background:rgba(0,0,0,.16);
      border:1px solid rgba(255,255,255,.065);
    }

    .macro b{
      display:block;
      color:var(--accent-3);
      font-size:20px;
      line-height:1.1;
    }

    .macro span{
      color:var(--muted);
      font-size:13px;
    }

    .variant{
      margin-top:14px;
      border-radius:20px;
      background:linear-gradient(135deg,rgba(168,77,62,.09),rgba(217,168,95,.07));
      border:1px solid rgba(217,168,95,.18);
      padding:14px;
      color:var(--muted);
      line-height:1.5;
    }

    .variant b{color:var(--accent-3)}

    footer{
      margin-top:18px;
      text-align:center;
      color:rgba(255,255,255,.42);
      font-size:13px;
    }

    @media(max-width:900px){
      .hero,.layout{grid-template-columns:1fr}
      .meta-grid{grid-template-columns:repeat(2,1fr)}
      .tips{grid-template-columns:1fr}
      .macro-grid{grid-template-columns:1fr 1fr}
    }

    @media(max-width:560px){
      .app{padding:14px 10px 30px}
      .hero{gap:12px;margin-bottom:12px}
      .layout{gap:12px}
      .hero-main,.hero-side,.section{padding:16px}
      .card{border-radius:22px}
      h1{font-size:clamp(34px,12vw,48px);letter-spacing:-.062em}
      .subtitle{font-size:16px;line-height:1.5}
      .meta-grid{grid-template-columns:1fr 1fr;gap:8px}
      .meta{padding:12px 10px;border-radius:16px}
      .meta b{font-size:16px}
      .plate{min-height:150px;border-radius:20px}
      .plate .big{font-size:72px}
      .todo{grid-template-columns:auto 1fr;padding:14px;gap:11px}
      .time{grid-column:2;justify-self:start;margin-top:2px}
      .todo-title{font-size:16px}
      .todo-desc{font-size:14px}
      .tabs{overflow-x:auto;flex-wrap:nowrap;margin-left:-2px;margin-right:-2px;padding-bottom:10px;position:relative}
      .tab{white-space:nowrap;flex:0 0 auto}
      .ing{align-items:flex-start;flex-direction:column;gap:4px;padding:12px}
      .ing .amount{text-align:left;white-space:normal}
      .macro-grid{grid-template-columns:1fr}
      .actions .btn{flex:1 1 auto}
    }


    .sauce-picker{
      display:inline-flex;
      gap:7px;
      padding:6px;
      margin-top:20px;
      border-radius:18px;
      background:rgba(0,0,0,.20);
      border:1px solid rgba(255,255,255,.08);
      max-width:100%;
    }

    .sauce-choice{
      border:0;
      cursor:pointer;
      min-height:42px;
      padding:10px 14px;
      border-radius:13px;
      color:var(--muted);
      background:transparent;
      font-weight:850;
      transition:.16s ease;
      white-space:nowrap;
    }

    .sauce-choice.active{
      color:#2c1b0d;
      background:linear-gradient(135deg,var(--accent-3),var(--accent));
      box-shadow:0 7px 20px rgba(0,0,0,.18);
    }

    .sauce-kicker{
      display:flex;
      align-items:center;
      gap:8px;
      color:var(--accent-3);
      font-size:13px;
      font-weight:900;
      letter-spacing:.04em;
      margin:0 0 9px;
    }

    @media(max-width:560px){
      .sauce-picker{display:grid;grid-template-columns:1fr 1fr;width:100%}
      .sauce-choice{padding:10px 9px;font-size:13px;white-space:normal}
    }

  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    const {useState,useEffect} = React;
    const h = React.createElement;

    const steakIngredients = [
      ["🥩 Говяжий стейк", "250–300 г · толщиной 2.5–3.5 см"],
      ["🧂 Соль", "по вкусу"],
      ["⚫ Чёрный перец", "по вкусу"],
      ["🌻 Нейтральное масло", "1 ч. л. / 5 г"],
      ["🧈 Сливочное масло для basting", "20 г"],
      ["🧄 Чеснок", "2 зубчика · раздавить"],
      ["🌿 Тимьян", "2–3 веточки"],
      ["🌿 Розмарин", "1 веточка · по желанию"]
    ];

    const redWineSauce = [
      ["🍷 Сухое красное вино", "90 мл"],
      ["🥣 Говяжий бульон", "110 мл"],
      ["🧅 Шалот / репчатый лук", "20 г · очень мелко"],
      ["🥄 Lea & Perrins Worcestershire", "1 ч. л. / ~5 мл"],
      ["🧈 Холодное сливочное масло", "12 г"],
      ["⚫ Чёрный перец", "по вкусу"]
    ];

    const pepperSauce = [
      ["⚫ Чёрный перец горошком", "4 г · крупно раздробить"],
      ["🟡 Дижонская горчица", "10 г · ~2 ч. л."],
      ["🥃 Бренди / коньяк", "30 мл"],
      ["🥄 Lea & Perrins Worcestershire", "8 мл · ~1½ ч. л."],
      ["🥣 Говяжий бульон", "80 мл"],
      ["🥛 Сливки 33%", "100 мл"],
      ["🧂 Соль", "маленькая щепотка · по необходимости"]
    ];

    const redOptional = [
      ["🌶️ McCormick Montreal Steak", "до ½ ч. л. на стейк"],
      ["🥄 Дижонская горчица", "½ ч. л. в соус"],
      ["🍋 Лимонный сок", "несколько капель в конце"]
    ];

    const pepperOptional = [
      ["🥛 Более сливочный вариант", "110 мл сливок 33%"],
      ["🌶️ Более перечный вариант", "70–80 мл сливок 33%"],
      ["🌿 Тимьян", "1 маленькая веточка в соус · необязательно"]
    ];

    const sharedBeforeSauce = [
      {
        group:"Подготовка", icon:"🥩", title:"Достань и обсуши стейк", time:"20–30 мин заранее",
        desc:"Достань стейк из холодильника примерно за 20–30 минут до жарки. Перед приготовлением очень тщательно промокни мясо бумажными полотенцами со всех сторон. Сухая поверхность критически важна для хорошей корочки — влажный стейк сначала будет париться."
      },
      {
        group:"Подготовка", icon:"🧂", title:"Приправь мясо", time:"30 сек",
        desc:"Посоли и поперчи стейк с обеих сторон непосредственно перед жаркой. Если используешь Montreal Steak, добавь совсем немного — до ½ ч. л. на весь стейк. Не делай толстый слой крупной приправы: чеснок и специи в ней могут подгореть на сильном огне."
      },
      {
        group:"Жарка", icon:"🔥", title:"Хорошо прогрей нержавейку", time:"2 мин",
        desc:"Поставь нержавеющую сковороду на средне-сильный огонь. Для плиты 1–9 ориентир 7/9. Прогрей сухую сковороду около 2 минут. Затем добавь 1 ч. л. нейтрального масла и быстро распредели по поверхности. Масло должно стать очень текучим и слегка мерцать."
      },
      {
        group:"Жарка", icon:"🥩", title:"Сделай первую корочку", time:"1½–2 мин",
        desc:"Выложи стейк на сковороду движением от себя. Слегка прижми щипцами только первые 5–10 секунд для полного контакта с металлом, затем не трогай мясо 1½–2 минуты. Не двигай его по сковороде — дай сформироваться глубокой коричневой корочке."
      },
      {
        group:"Жарка", icon:"🔄", title:"Переверни стейк", time:"1½–2 мин",
        desc:"Переверни стейк щипцами и обжарь вторую сторону ещё примерно 1½–2 минуты. Если стейк толстый и имеет выраженную жировую кромку, поставь его на бок щипцами и подрумянь края по 20–30 секунд."
      },
      {
        group:"Basting", icon:"🧈", title:"Убавь огонь и добавь масло", time:"10–15 сек",
        desc:"Убавь нагрев примерно до 5/9. Добавь 20 г сливочного масла, 2 раздавленных зубчика чеснока, тимьян и при желании розмарин. Масло быстро вспенится. Если оно сразу становится очень тёмным или дымит, огонь слишком высокий — снизь нагрев."
      },
      {
        group:"Basting", icon:"🥄", title:"Поливай стейк ароматным маслом", time:"45–90 сек",
        desc:"Слегка наклони сковороду так, чтобы масло собралось с одной стороны. Большой ложкой постоянно зачерпывай пенящееся масло с чесноком и травами и поливай верхнюю поверхность стейка. Через 30–45 секунд переверни стейк и продолжи basting второй стороны."
      },
      {
        group:"Температура", icon:"🌡️", title:"Проверь температуру термометром", time:"10–20 сек",
        desc:"Вводи щуп сбоку в самую толстую центральную часть стейка. Для medium снимай мясо примерно при 53–54°C — во время отдыха температура обычно поднимется до примерно 56–58°C. Для medium-rare снимай при 50–52°C."
      },
      {
        group:"Отдых", icon:"⏸️", title:"Дай стейку отдохнуть", time:"5–8 мин",
        desc:"Переложи стейк на тёплую тарелку или доску. Не разрезай его. Оставь на 5–8 минут, пока готовишь выбранный соус. Если накрываешь фольгой, не заворачивай плотно, иначе корочка размокнет."
      },
      {
        group:"Соус", icon:"🧹", title:"Подготовь сковороду после стейка", time:"20–30 сек",
        desc:"Не мой сковороду: коричневый fond на дне — база будущего соуса. Удали чеснок и травы после basting. Чёрные горелые кусочки лучше убрать. Если жира осталось много, аккуратно слей лишнее, оставив примерно 1 ч. л."
      }
    ];

    const redSteps = [
      {
        group:"Подготовка", icon:"🧄", title:"Подготовь всё для basting и red wine sauce", time:"2–3 мин",
        desc:"Слегка раздави 2 зубчика чеснока, подготовь тимьян и розмарин. Очень мелко нарежь 20 г шалота или лука. Отмерь 90 мл красного вина, 110 мл говяжьего бульона, 1 ч. л. Worcestershire, 20 г масла для basting и 12 г холодного масла для финиша соуса."
      },
      {
        group:"Соус", icon:"🧅", title:"Обжарь шалот или лук", time:"30–60 сек",
        desc:"Поставь сковороду примерно на 5/9. Добавь 20 г очень мелко нарезанного шалота или лука. Готовь 30–60 секунд, постоянно помешивая, пока он не станет мягче и ароматнее. Не давай ему сильно темнеть."
      },
      {
        group:"Соус", icon:"🍷", title:"Деглазируй красным вином", time:"2–3 мин",
        desc:"Влей 90 мл сухого красного вина. Сразу пройдись деревянной или силиконовой лопаткой по дну и раствори весь коричневый fond. Дай вину активно кипеть примерно 2–3 минуты, пока объём не уменьшится примерно до 25–35 мл и резкий алкогольный запах почти не исчезнет."
      },
      {
        group:"Соус", icon:"🥣", title:"Добавь говяжий бульон", time:"10 сек",
        desc:"Влей 110 мл говяжьего бульона. Добавь 1 ч. л. Worcestershire и немного свежемолотого чёрного перца. Соль пока не добавляй: бульон и Worcestershire уже солёные, а при уваривании вкус станет ещё концентрированнее."
      },
      {
        group:"Соус", icon:"♨️", title:"Увари red wine pan sauce", time:"3–5 мин",
        desc:"Готовь при умеренном активном кипении 3–5 минут. Цель — уменьшить соус примерно до 50–70 мл. Проведи ложкой по соусу: готовый соус должен слегка покрывать обратную сторону ложки, а не стекать как вода."
      },
      {
        group:"Соус", icon:"🥄", title:"При желании добавь дижон", time:"10 сек",
        desc:"Если хочешь чуть более сложный steakhouse-профиль, вмешай примерно ½ ч. л. дижонской горчицы. Она добавит лёгкую остроту и поможет соусу ощущаться более собранным, но не должна доминировать."
      },
      {
        group:"Финиш", icon:"🧈", title:"Сними с огня и вмешай холодное масло", time:"30–45 сек",
        desc:"Сними сковороду с огня и подожди 10–15 секунд. Добавь 12 г холодного сливочного масла небольшими кусочками и постоянно покачивай сковороду или энергично перемешивай ложкой. Масло должно эмульгироваться и сделать соус глянцевым и шелковистым."
      },
      {
        group:"Финиш", icon:"👅", title:"Отрегулируй вкус винного соуса", time:"20 сек",
        desc:"Попробуй соус только после добавления масла. Если не хватает соли — добавь совсем немного. Если хочется ярче — несколько капель лимонного сока. Если хочется глубже и мяснее — буквально несколько дополнительных капель Worcestershire."
      }
    ];

    const pepperSteps = [
      {
        group:"Подготовка", icon:"⚫", title:"Подготовь всё для peppercorn cream sauce", time:"2–3 мин",
        desc:"Раздави в ступке 4 г чёрного перца горошком достаточно крупно — не превращай его в пыль. Отмерь 10 г Dijon, 30 мл бренди или коньяка, 8 мл Worcestershire, 80 мл говяжьего бульона и 100 мл сливок 33%. Всё должно стоять рядом: этот соус готовится быстро."
      },
      {
        group:"Соус", icon:"⚫", title:"Поджарь дроблёный перец", time:"20–30 сек",
        desc:"После подготовки сковороды снизь нагрев примерно до 3–4/9. Всыпь 4 г крупно раздробленного чёрного перца и прогревай 20–30 секунд, постоянно помешивая. Как только появится яркий аромат жареного перца, сразу переходи дальше — пережаренный перец может горчить."
      },
      {
        group:"Соус", icon:"🟡", title:"Добавь дижонскую горчицу", time:"10 сек",
        desc:"Добавь 10 г дижонской горчицы и быстро размешай её с перцем около 10 секунд. Не жарь горчицу долго — здесь нужно только раскрыть аромат и соединить её с перечной основой."
      },
      {
        group:"Соус", icon:"🥃", title:"Деглазируй бренди", time:"45–60 сек",
        desc:"Подними нагрев примерно до 5/9 и влей 30 мл бренди или коньяка. Лопаткой раствори fond со дна. Дай жидкости активно покипеть 45–60 секунд, чтобы резкий запах алкоголя почти ушёл и бренди заметно уварился. Фламбировать не обязательно."
      },
      {
        group:"Соус", icon:"🥄", title:"Добавь Worcestershire", time:"10–15 сек",
        desc:"Влей 8 мл Lea & Perrins Worcestershire и перемешай. Добавь только крошечную щепотку соли — а лучше сначала вообще без неё, если бульон солёный. Финально досолить безопаснее уже готовый соус."
      },
      {
        group:"Соус", icon:"🥣", title:"Влей говяжий бульон и увари", time:"2–3 мин",
        desc:"Влей 80 мл крепкого говяжьего бульона, хорошо перемешай и доведи до уверенного simmer. Увари примерно 2–3 минуты, ориентируясь на 50–60 мл насыщенной основы. Соус на этом этапе ещё должен быть жидким — густота появится после сливок."
      },
      {
        group:"Соус", icon:"🥛", title:"Влей сливки 33%", time:"2–4 мин",
        desc:"Убавь нагрев до 3–4/9 и постепенно влей 100 мл сливок 33%, постоянно перемешивая. Поддерживай мягкое кипение 2–4 минуты без бурного бурления. Соус должен стать кремовым и начать покрывать ложку тонким слоем."
      },
      {
        group:"Финиш", icon:"👅", title:"Поймай правильную густоту и вкус", time:"20–40 сек",
        desc:"Проведи лопаткой по дну: дорожка должна держаться около секунды, после чего соус снова соединяется. Попробуй. При необходимости добавь микроскопическую щепотку соли. Если стал слишком густым — вмешай 1–2 ст. л. бульона; если жидкий — дай ещё немного мягко покипеть."
      }
    ];

    const sharedFinish = [
      {
        group:"Подача", icon:"🔪", title:"Нарежь стейк поперёк волокон", time:"30–60 сек",
        desc:"После отдыха найди направление волокон и нарежь стейк поперёк них ломтиками примерно 8–12 мм. Если стейк очень хороший и нежный, можешь подать целиком и резать уже на тарелке."
      },
      {
        group:"Подача", icon:"🍽️", title:"Добавь соус и подавай", time:"сразу",
        desc:"Выложи стейк на тарелку и добавь часть выбранного соуса. Не заливай всю корочку толстым слоем — лучше оставить часть поверхности стейка открытой, а остаток соуса подать рядом."
      }
    ];

    const sauceInfo = {
      red: {
        short:"🍷 Red Wine",
        full:"Red wine pan sauce",
        emoji:"🍷",
        metaValue:"90 мл",
        metaLabel:"красного вина",
        subtitle:"Классический pan sauce: красное вино, beef stock, Worcestershire и холодное масло. Более тёмный, мясной и винный профиль.",
        ingredients:redWineSauce,
        optional:redOptional,
        prep:redSteps[0],
        steps:redSteps.slice(1),
        note:"Главная пропорция: 90 мл сухого красного вина → уварить примерно до 30 мл → 110 мл beef stock + 1 ч. л. Worcestershire → уварить до 50–70 мл → снять с огня → вмешать 12 г холодного масла.",
        variants:[
          ["Какое вино брать? ","Сухое красное: Cabernet Sauvignon, Merlot, Syrah/Shiraz или Pinot Noir. Полусладкое и сладкое лучше не использовать — при уваривании сахар станет слишком заметным."],
          ["Что такое хороший fond? ","Коричневые мясные следы на дне — это концентрированный вкус. Чёрные горелые куски лучше убрать, чтобы соус не горчил."],
          ["Почему масло в самом конце? ","Холодное масло вне сильного огня эмульгируется с вином и бульоном. Соус становится глянцевым, шелковистым и немного гуще без муки или сливок."],
          ["Если соус слишком жидкий: ","Не добавляй муку. Увари ещё 1–2 минуты и только затем снимай с огня и вмешивай холодное масло."]
        ]
      },
      pepper: {
        short:"⚫ Peppercorn Cream",
        full:"Black peppercorn cream sauce",
        emoji:"⚫",
        metaValue:"100 мл",
        metaLabel:"сливок 33%",
        subtitle:"Классический сливочно-перечный steakhouse sauce: крупный чёрный перец, Dijon, бренди, Worcestershire, beef stock и сливки 33%.",
        ingredients:pepperSauce,
        optional:pepperOptional,
        prep:pepperSteps[0],
        steps:pepperSteps.slice(1),
        note:"Наша базовая пропорция на 1 большой стейк: 4 г перца + 10 г Dijon + 30 мл бренди + 8 мл Worcestershire + 80 мл beef stock + 100 мл сливок 33%.",
        variants:[
          ["Как дробить перец? ","Крупно и неоднородно. Нужны кусочки перца, а не перечная пыль — так вкус получается ярким, но не грязно-горьким."],
          ["Насколько сливочным делать? ","100 мл — сбалансированный вариант. 110 мл даст более мягкий и сливочный профиль; 70–80 мл — темнее, острее и заметно перечнее."],
          ["Нужно ли фламбировать бренди? ","Нет. Достаточно хорошо прокипятить его 45–60 секунд, чтобы алкоголь выветрился и вкус сконцентрировался."],
          ["Если соус слишком густой: ","Вмешай 1–2 ст. л. говяжьего бульона. Если слишком жидкий — мягко увари ещё немного; мука здесь не нужна."]
        ]
      }
    };

    function buildSteps(mode){
      const cfg = sauceInfo[mode];
      return [sharedBeforeSauce[0], sharedBeforeSauce[1], cfg.prep, ...sharedBeforeSauce.slice(2), ...cfg.steps, ...sharedFinish];
    }

    function App(){
      const [mode,setMode] = useState(() => {
        try{return localStorage.getItem("steakSauceMode") || "red";}catch{return "red";}
      });
      const [allDone,setAllDone] = useState(() => {
        try{return JSON.parse(localStorage.getItem("steakTwoSaucesDone") || '{"red":{},"pepper":{}}');}
        catch{return {red:{},pepper:{}};}
      });
      const [tab,setTab] = useState("Все");

      const cfg = sauceInfo[mode];
      const steps = buildSteps(mode);
      const done = allDone[mode] || {};

      useEffect(() => {
        try{localStorage.setItem("steakSauceMode",mode);}catch{}
        setTab("Все");
      },[mode]);

      useEffect(() => {
        try{localStorage.setItem("steakTwoSaucesDone",JSON.stringify(allDone));}catch{}
      },[allDone]);

      const groups = ["Все",...Array.from(new Set(steps.map(s=>s.group)))];
      const filtered = tab === "Все" ? steps : steps.filter(s=>s.group === tab);
      const completed = steps.filter((_,i)=>done[i]).length;
      const percent = Math.round((completed / steps.length) * 100);

      const toggle = idx => setAllDone(prev => ({
        ...prev,
        [mode]: {...(prev[mode]||{}), [idx]:!(prev[mode]||{})[idx]}
      }));
      const reset = () => setAllDone(prev => ({...prev,[mode]:{}}));
      const markAll = () => {
        const all = {};
        steps.forEach((_,i)=>all[i]=true);
        setAllDone(prev => ({...prev,[mode]:all}));
      };

      return h("div",{className:"app"},
        h("section",{className:"hero"},
          h("div",{className:"card hero-main"},
            h("div",{className:"badge"},"🥩 Recipe Todo · 1 большой стейк · 2 соуса"),
            h("h1",null,"Стейк с butter basting + два steakhouse-соуса"),
            h("p",{className:"subtitle"},
              "Одна техника стейка и два альтернативных соуса на том же fond. Выбирай винный pan sauce или сливочно-перечный peppercorn cream — ингредиенты, шаги и прогресс переключаются вместе."
            ),
            h("div",{className:"sauce-picker",role:"tablist","aria-label":"Выбор соуса"},
              h("button",{className:"sauce-choice "+(mode==="red"?"active":""),onClick:()=>setMode("red"),role:"tab",ariaSelected:mode==="red"},"🍷 Red Wine"),
              h("button",{className:"sauce-choice "+(mode==="pepper"?"active":""),onClick:()=>setMode("pepper"),role:"tab",ariaSelected:mode==="pepper"},"⚫ Peppercorn Cream")
            ),
            h("div",{className:"meta-grid"},
              h("div",{className:"meta"},h("b",null,"250–300 г"),h("span",null,"говяжий стейк")),
              h("div",{className:"meta"},h("b",null,"2.5–3.5 см"),h("span",null,"толщина")),
              h("div",{className:"meta"},h("b",null,"53–54°C"),h("span",null,"снять для medium")),
              h("div",{className:"meta"},h("b",null,cfg.metaValue),h("span",null,cfg.metaLabel))
            )
          ),
          h("aside",{className:"card hero-side"},
            h("div",{className:"plate"},
              h("span",{className:"float f1"},cfg.emoji),
              h("span",{className:"float f2"},"🧄"),
              h("span",{className:"float f3"},"🌿"),
              h("span",{className:"float f4"},mode==="pepper"?"🥛":"🧈"),
              h("span",{className:"float f5"},"🌡️"),
              h("span",{className:"big"},"🥩")
            ),
            h("div",{className:"progress-wrap"},
              h("div",{className:"progress-top"},
                h("span",null,"Прогресс · "+cfg.short),
                h("b",null,completed + "/" + steps.length + " · " + percent + "%")
              ),
              h("div",{className:"bar"},h("div",{className:"fill",style:{width:percent + "%"}}))
            ),
            h("div",{className:"actions"},
              h("button",{className:"btn primary",onClick:markAll},"Готово всё"),
              h("button",{className:"btn",onClick:reset},"Сбросить")
            )
          )
        ),

        h("main",{className:"layout"},
          h("aside",{className:"card section"},
            h("h2",null,"Ингредиенты"),
            h("div",{className:"sauce-kicker"},cfg.emoji," Сейчас выбран: ",cfg.full),
            h("p",{className:"subtitle",style:{fontSize:"15px",marginBottom:"15px"}},cfg.subtitle),

            h("h3",null,"Стейк и basting"),
            h("div",{className:"ingredients"},
              steakIngredients.map((item,i)=>h("div",{className:"ing",key:"ing"+i},h("span",{className:"name"},item[0]),h("span",{className:"amount"},item[1])))
            ),

            h("h3",null,cfg.full),
            h("div",{className:"ingredients"},
              cfg.ingredients.map((item,i)=>h("div",{className:"ing",key:"sauce"+mode+i},h("span",{className:"name"},item[0]),h("span",{className:"amount"},item[1])))
            ),

            h("h3",null,"Опционально / настройка"),
            h("div",{className:"ingredients"},
              cfg.optional.map((item,i)=>h("div",{className:"ing",key:"opt"+mode+i},h("span",{className:"name"},item[0]),h("span",{className:"amount"},item[1])))
            ),

            h("p",{className:"note"},cfg.note),

            h("h3",null,"Температуры"),
            h("div",{className:"macro-grid"},
              h("div",{className:"macro"},h("b",null,"50–52°C"),h("span",null,"снять для medium-rare")),
              h("div",{className:"macro"},h("b",null,"53–54°C"),h("span",null,"снять для medium")),
              h("div",{className:"macro"},h("b",null,"5–8 мин"),h("span",null,"отдых стейка")),
              h("div",{className:"macro"},h("b",null,"7/9 → 5/9"),h("span",null,"корочка → basting"))
            ),

            cfg.variants.map((v,i)=>h("div",{className:"variant",key:"v"+mode+i},h("b",null,v[0]),v[1]))
          ),

          h("section",{className:"card section"},
            h("h2",null,"Пошаговый todo"),
            h("div",{className:"tabs"},
              groups.map(g=>h("button",{key:g,className:"tab "+(tab===g?"active":""),onClick:()=>setTab(g)},g))
            ),
            h("div",{className:"todo-list"},
              filtered.map(step=>{
                const originalIdx = steps.indexOf(step);
                return h("label",{className:"todo "+(done[originalIdx]?"done":""),key:mode+step.title},
                  h("input",{className:"check",type:"checkbox",checked:!!done[originalIdx],onChange:()=>toggle(originalIdx)}),
                  h("div",null,h("p",{className:"todo-title"},step.icon+" "+step.title),h("p",{className:"todo-desc"},step.desc)),
                  h("span",{className:"time"},step.time)
                );
              })
            ),

            h("div",{className:"tips"},
              h("div",{className:"tip"},h("b",null,"🔥 Корочка"),h("span",null,"Стейк должен быть очень сухим, а сковорода хорошо прогрета. После выкладки не двигай мясо первые 1½–2 минуты — так сформируется корочка и хороший fond.")),
              h("div",{className:"tip"},h("b",null,"🧈 Basting"),h("span",null,"Масло добавляй после первичной обжарки и снижения огня. Пенящееся коричневатое масло — хорошо; чёрное, дымящее и горькое — уже перегрето.")),
              h("div",{className:"tip"},h("b",null,cfg.emoji+" "+cfg.full),h("span",null,mode==="red"?"Сначала хорошо увари вино, потом добавляй бульон; холодное масло идёт только после нужной концентрации.":"Перец только слегка поджариваем; бренди хорошо увариваем; после сливок держим мягкий simmer, а не бурное кипение."))
            )
          )
        ),

        h("footer",null,"Steak · butter basting · "+cfg.full+" · stainless steel pan · отдельный прогресс для каждого соуса")
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(h(App));
  </script>
</body>
</html>
